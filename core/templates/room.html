{% extends "base.html" %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] bg-base-200 px-4 py-1">
  <div
    class="mx-auto flex h-[calc(100vh-5rem)] w-full max-w-4xl flex-col overflow-hidden rounded-2xl border border-base-300 bg-base-100 shadow-xl"
  >
    {% include 'partials/room-header.html' %}

    <!-- Messages -->
    <main
      class="flex-1 overflow-y-auto bg-base-200/50 px-4 py-1 sm:px-6"
      x-data="{}"
      x-init="
      scrollToBottom = () =>$el.scrollTo({top:$el.scrollHeight , behavior:'smooth'})
      setTimeout(scrollToBottom , 500)
      document.body.addEventListener('htmx:wsAfterMessage' , scrollToBottom)
      "
    >
      <div id="chat-box" class="mx-auto max-w-3xl space-y-2">
        {% for message in messages %}
        {% include 'partials/message.html' %}
        {% empty %}
        {% include 'partials/chat-empty-state.html' %}
        {% endfor %}
      </div>
    </main>

    {% include 'partials/message-input.html' %}
  </div>
</div>
{% endblock %}
