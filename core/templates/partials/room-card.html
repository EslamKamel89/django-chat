<a
  href="{% url 'room' room.slug %}"
  class="group rounded-xl border border-base-300 bg-base-100 p-4 transition-all duration-200 hover:-translate-y-0.5 hover:border-primary/40 hover:bg-base-200 hover:shadow-md"
>
  <div class="flex items-center gap-4">
    <!-- Room Icon -->
    <div
      class="flex size-12 shrink-0 items-center justify-center rounded-xl bg-primary/10 text-primary transition-colors group-hover:bg-primary group-hover:text-primary-content"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.8"
        stroke="currentColor"
        class="size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M8.625 9.75a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm0 0H8.25m5.625 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1-1.5 0Zm0 0h-.375m-5.625 0a.75.75 0 1 1-1.5 0 .75 0 0 1 1.5 0Zm0 0H8.25m9.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm0 0h-.375M3.75 5.25h16.5A2.25 2.25 0 0 1 22.5 7.5v9a2.25 2.25 0 0 1-2.25 2.25H15l-3 3-3-3H3.75A2.25 2.25 0 0 1 1.5 16.5v-9a2.25 2.25 0 0 1 2.25-2.25Z"
        />
      </svg>
    </div>

    <!-- Room Information -->
    <div class="min-w-0 flex-1">
      <h3 class="truncate font-semibold text-base-content">
        {{ room.name }}
      </h3>
      <p class="mt-1 text-sm text-base-content/50">Join room</p>
    </div>

    <!-- Arrow -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke="currentColor"
      class="size-5 text-base-content/30 transition-transform group-hover:translate-x-1 group-hover:text-primary"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
    </svg>
  </div>
</a>
