<!-- Message Input -->
<footer class="border-t border-base-300 bg-base-100 py-4">
  <form id="chat-form" class="mx-auto flex max-w-3xl items-end gap-3">
    <div class="flex-1">
      <textarea
        id="chat-message-input"
        name="message"
        minlength="2"
        class="textarea w-full resize-none"
        placeholder="Write a message..."
        rows="1"
      ></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        class="size-5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.769 59.769 0 0 1 3.27 20.875L6 12Zm0 0h7.5"
        />
      </svg>
      <span class="hidden sm:inline">Send</span>
    </button>
  </form>
</footer>
