{% load allauth %}

<div class="form-control mb-6 w-full">
  {% if attrs.type == "checkbox" or attrs.type == "radio" %}

  <label
    for="{{ attrs.id }}"
    class="label cursor-pointer justify-start gap-3 rounded-lg border border-base-300 bg-base-100 px-4 py-3 transition-colors hover:bg-base-200"
  >
    <input
      class="{% if attrs.type == 'checkbox' %}checkbox checkbox-primary{% else %}radio radio-primary{% endif %}"
      {% if attrs.required %}required{% endif %}
      {% if attrs.disabled %}disabled{% endif %}
      {% if attrs.readonly %}readonly{% endif %}
      {% if attrs.checked %}checked{% endif %}
      {% if attrs.name %}name="{{ attrs.name }}"
      {% endif %}
      {% if attrs.id %}id="{{ attrs.id }}"
      {% endif %}
      {% if attrs.value is not None %}value="{{ attrs.value }}"
      {% endif %}
      type="{{ attrs.type }}"
    />

    <span class="text-sm font-medium text-base-content">
      {% slot label %}
      {% endslot %}
    </span>
  </label>

  {% else %}

  <fieldset class="fieldset w-full p-0">
    <label
      for="{{ attrs.id }}"
      class="fieldset-legend mb-1 px-0 text-sm font-semibold text-base-content"
    >
      {% slot label %}
      {% endslot %}
    </label>

    {% if attrs.type == "textarea" %}

    <textarea
      class="textarea textarea-bordered textarea-md min-h-32 w-full transition focus:border-primary focus:outline-primary {% if attrs.errors %}textarea-error{% endif %}"
      {% if attrs.required %}required{% endif %}
      {% if attrs.rows %}rows="{{ attrs.rows }}"
      {% endif %}
      {% if attrs.disabled %}disabled{% endif %}
      {% if attrs.readonly %}readonly{% endif %}
      {% if attrs.name %}name="{{ attrs.name }}"
      {% endif %}
      {% if attrs.id %}id="{{ attrs.id }}"
      {% endif %}
      {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"
      {% endif %}
    >
{% slot value %}{% endslot %}</textarea>

    {% else %}

    <input
      class="input input-md w-full transition focus:border-primary focus:outline-primary {% if attrs.errors %}input-error{% endif %}"
      {% if attrs.required %}required{% endif %}
      {% if attrs.disabled %}disabled{% endif %}
      {% if attrs.readonly %}readonly{% endif %}
      {% if attrs.checked %}checked{% endif %}
      {% if attrs.name %}name="{{ attrs.name }}"
      {% endif %}
      {% if attrs.id %}id="{{ attrs.id }}"
      {% endif %}
      {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"
      {% endif %}
      {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"
      {% endif %}
      {% if attrs.value is not None %}value="{{ attrs.value }}"
      {% endif %}
      type="{{ attrs.type }}"
    />

    {% endif %}

    {% if attrs.errors %}
    <div class="label px-0 pt-2">
      <span class="label-text-alt text-sm font-medium text-error">
        {{ attrs.errors }}
      </span>
    </div>
    {% endif %}

    {% if slots.help_text %}
    <div class="label px-0 pt-1">
      <span class="label-text-alt text-sm leading-5 text-base-content/60">
        {% slot help_text %}
        {% endslot %}
      </span>
    </div>
    {% endif %}
  </fieldset>

  {% endif %}
</div>
