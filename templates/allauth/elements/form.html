{% load allauth %}

<form
  method="{{ attrs.method }}"
  {% if attrs.action %}action="{{ attrs.action }}"
  {% endif %}
  class="space-y-1"
>
  {% slot body %}
  {% endslot %}

  {% if slots.actions %}
  <div class="mt-6 space-y-3">
    {% slot actions %}
    {% endslot %}
  </div>
  {% endif %}
</form>
